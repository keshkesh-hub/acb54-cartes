function snapshot(){return {title:$('title').value,items:items,savedAt:new Date().toISOString()}}
function persist(show=true){localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshot()));if(show)$('status').textContent='✓ Planning enregistré sur cet appareil'}
function restore(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return false;const data=JSON.parse(raw);items=Array.isArray(data.items)?data.items:[];$('title').value=data.title||'PROGRAMME DE LA SEMAINE';render();$('status').textContent='✓ Planning enregistré restauré';return true}catch(e){return false}}
$('savePlanning').onclick=()=>persist(true);
$('newPlanning').onclick=()=>{if(items.length&&!confirm('Créer un nouveau planning ? Le planning enregistré sera effacé sur cet appareil.'))return;items=[];localStorage.removeItem(STORAGE_KEY);$('title').value='PROGRAMME DE LA SEMAINE';$('activity').value='';$('place').value='Local ACB-54';$('start').value='18:00';$('end').value='19:00';$('note').value='';const nd=new Date();$('date').value=nd.toISOString().slice(0,10);render();$('status').textContent='Nouveau planning prêt'};
// Sauvegarde automatique des activités et du titre.
const renderOriginal=render;
render=function(){renderOriginal();localStorage.setItem(STORAGE_KEY,JSON.stringify(snapshot()))};
$('title').addEventListener('change',()=>persist(false));
let d=new Date();$('date').value=d.toISOString().slice(0,10);if(!$('place').value)$('place').value='Local ACB-54';if(!$('start').value)$('start').value='18:00';if(!$('end').value)$('end').value='19:00';if(!restore())render();
</script></body></html>
